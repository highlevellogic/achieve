 <script>
 function fetchData(url, method = "GET", parms = "") {
    console.log(url, method, parms);

    if (url === undefined) {
        console.error("XHR Error: url not set in fetchData().");
        return;
    }

    var xhr = new XMLHttpRequest();

    xhr.open(method, url, true);
    xhr.responseType = "text";
    xhr.onload = callback;

    xhr.setRequestHeader(
        "Content-type",
        "application/x-www-form-urlencoded;charset=utf-8"
    );
    xhr.setRequestHeader("encoding", "utf-8");

    if (parms.length > 0) {
        xhr.send(parms);
    } else {
        xhr.send();
    }
}
function output (msg="", elementID="result") {
  document.getElementById(elementID).innerHTML = msg;
}
function callback() {
  if (this.status < 400) {
    output(this.responseText);
  } else {
    console.error(this.responseText);
  }
}
function init () {
  // START TEST HERE
  var url = "servlets/hello.jss";
  fetchData (url,"post");

}
window.onload=init;
